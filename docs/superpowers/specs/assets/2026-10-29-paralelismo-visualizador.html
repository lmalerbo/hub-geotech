<title>Visualizador do Paralelismo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,500,0,0" rel="stylesheet">
<style>
/* Layout: o mapa é o palco (janela inteira) e a coluna de 380 px à direita muda com a aba; tokens do Hub (app/corretivos.css). */
:root{
  --bg:#eff3f7;--sf:#fff;--s2:#edf0f8;--bd:#e5e9ec;--bd2:#dde1f0;
  --t1:#20262e;--t2:#4d4a57;--t3:#8a8794;
  --mapa:#e6ecf0;--borda-tal:#ffffff;--carreador:#d5dde3;
  --plantio:#16a76b;--colheita:#d4890a;--drones:#5b6ee8;--erro:#d23f3f;
  --ab:#e07b1a;--ad:#16a76b;--ac:#5b6ee8;
  --r1:#cf5b3f;--r2:#e3a33c;--r3:#9cc76d;--r4:#1f9e63;
  --sh-sm:0 4px 20px rgb(0 0 0/.06);--sh-md:0 12px 40px rgb(0 0 0/.10);
  --r-sm:8px;--r-md:12px;--r-lg:20px;
  --sai:cubic-bezier(.16,1,.3,1);--mola:cubic-bezier(.34,1.56,.64,1);
  --f:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
/* Só tema claro, como o Hub. */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--f);font-size:13px;background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.ico{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:20px;line-height:1;display:inline-block;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
:focus-visible{outline:2px solid var(--plantio);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{height:100%;display:grid;grid-template-rows:auto 1fr}
.topo{display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--sf);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.voltar{display:flex;align-items:center;gap:4px;border:0;background:none;color:var(--t3);cursor:pointer;padding:4px 6px;border-radius:var(--r-sm)}
.voltar:hover{background:var(--s2);color:var(--t1)}
.marca{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.marca .sel{width:30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--plantio) 14%,transparent);color:var(--plantio);display:grid;place-items:center}
.abas{display:flex;gap:2px;background:var(--s2);padding:3px;border-radius:10px;margin-left:8px}
.aba{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--t2);font-weight:500;display:flex;align-items:center;gap:6px;transition:background .2s,color .2s}
.aba[aria-selected="true"]{background:var(--sf);color:var(--t1);box-shadow:var(--sh-sm)}
.aba .cont{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--colheita);color:#fff;font-size:11px;font-weight:600;display:inline-grid;place-items:center}
.aba .cont.pop{animation:pop .45s var(--mola)}
.espaco{flex:1}
.nivel{display:flex;align-items:center;gap:6px;color:var(--t3);font-size:12px}
.nivel select{border:1px solid var(--bd2);background:var(--sf);border-radius:8px;padding:5px 8px}
.btn-notas{border:1px solid var(--bd2);background:var(--sf);border-radius:8px;padding:5px 10px;cursor:pointer;display:flex;gap:6px;align-items:center;color:var(--t2)}

.palco{display:grid;grid-template-columns:1fr 380px;min-height:0}
.mapa{position:relative;min-height:0;background:var(--mapa);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.arrastando{cursor:grabbing}
.col{background:var(--sf);border-left:1px solid var(--bd);overflow-y:auto;min-height:0;padding:18px 18px 28px;display:flex;flex-direction:column;gap:16px}

/* sobreposições do mapa */
.trilha{position:absolute;top:12px;left:12px;display:flex;gap:4px;align-items:center;background:var(--sf);border-radius:10px;padding:6px 10px;box-shadow:var(--sh-sm);font-size:12px;color:var(--t3);max-width:calc(100% - 24px);flex-wrap:wrap}
.trilha button{border:0;background:none;cursor:pointer;color:var(--t2);padding:0;font-weight:500}
.trilha button:hover{color:var(--plantio)}
.trilha b{color:var(--t1);font-weight:600}
.camadas{position:absolute;top:12px;right:12px;display:flex;gap:2px;background:var(--sf);border-radius:10px;padding:3px;box-shadow:var(--sh-sm)}
.camadas button{border:0;background:none;border-radius:8px;padding:5px 10px;cursor:pointer;color:var(--t2);font-size:12px;font-weight:500}
.camadas button[aria-pressed="true"]{background:var(--t1);color:var(--sf)}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;background:var(--sf);border-radius:10px;box-shadow:var(--sh-sm);overflow:hidden}
.zoom button{border:0;background:none;width:34px;height:34px;cursor:pointer;color:var(--t2);display:grid;place-items:center}
.zoom button+button{border-top:1px solid var(--bd)}
.legenda{position:absolute;left:12px;bottom:12px;background:var(--sf);border-radius:10px;padding:8px 12px;box-shadow:var(--sh-sm);font-size:11px;color:var(--t2);display:flex;flex-direction:column;gap:6px;max-width:calc(100% - 80px)}
.legenda .lin{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:inline-flex;align-items:center;gap:5px}
.sw i{width:12px;height:12px;border-radius:3px;display:inline-block}
.sw i.p{width:8px;height:8px;border-radius:50%}
.exemplo{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:color-mix(in srgb,var(--colheita) 16%,var(--sf));color:var(--t2);font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;pointer-events:none;white-space:nowrap}
.dica{position:absolute;pointer-events:none;background:var(--t1);color:var(--sf);border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.45;box-shadow:var(--sh-md);transform:translate(12px,12px);opacity:0;transition:opacity .12s;min-width:150px}
.dica.on{opacity:1}
.dica b{font-weight:600}
.faixa-fase{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:var(--sf);border-radius:14px;box-shadow:var(--sh-md);padding:10px 14px;display:flex;align-items:center;gap:12px;min-width:min(440px,calc(100% - 140px));animation:entra .35s var(--sai)}
.faixa-fase .txt{flex:1;min-width:0}
.faixa-fase .t{font-weight:600}
.faixa-fase .s{font-size:11px;color:var(--t3)}
.passos{display:flex;gap:4px;margin-top:6px}
.passos span{flex:1;height:4px;border-radius:2px;background:var(--s2);overflow:hidden;position:relative}
.passos span i{position:absolute;inset:0;background:var(--plantio);transform-origin:left;transform:scaleX(0)}

/* campo (indicador de espera do Hub, Mo.campo) */
.campo{display:inline-flex;gap:3px;align-items:flex-end;height:16px}
.campo i{width:4px;height:16px;border-radius:2px;transform-origin:bottom;animation:cresce 1.1s ease-in-out infinite}
.campo i:nth-child(1){background:#16a76b}.campo i:nth-child(2){background:#a07840;animation-delay:.12s}.campo i:nth-child(3){background:#d4890a;animation-delay:.24s}.campo i:nth-child(4){background:#5b6ee8;animation-delay:.36s}
@keyframes cresce{0%,100%{transform:scaleY(.25);opacity:.5}40%{transform:scaleY(1);opacity:1}}
@keyframes entra{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes entra2{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes treme{20%{transform:translateX(-5px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes listra{to{background-position:22.6px 0}}
@keyframes traco{to{stroke-dashoffset:0}}
@keyframes onda{from{transform:scale(1);opacity:.7}to{transform:scale(2.4);opacity:0}}
@keyframes some{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}

/* coluna */
.cab .ey{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);font-weight:600}
.cab h2{margin:2px 0 0;font-size:20px;font-weight:600;text-wrap:balance;line-height:1.25}
.cab p{margin:4px 0 0;color:var(--t3);font-size:12px}
.grande{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.grande .v{font-size:38px;font-weight:600;letter-spacing:-.02em;line-height:1}
.grande .d{font-size:13px;font-weight:600;padding:2px 8px;border-radius:12px}
.d.sobe{background:color-mix(in srgb,var(--ad) 15%,transparent);color:var(--ad)}
.d.desce{background:color-mix(in srgb,var(--ab) 15%,transparent);color:var(--ab)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--s2);border-radius:var(--r-md);padding:10px}
.kpi .l{font-size:11px;color:var(--t3)}
.kpi .v{font-size:17px;font-weight:600;margin-top:2px}
.barra3{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--s2)}
.barra3 i{display:block;height:100%;transition:width .6s var(--sai)}
.leg3{display:flex;justify-content:space-between;font-size:11px;color:var(--t3);margin-top:5px}
.sec h3{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--t2);display:flex;justify-content:space-between;align-items:center}
.sec h3 small{font-weight:500;color:var(--t3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--bd2);background:var(--sf);border-radius:20px;padding:4px 11px;cursor:pointer;font-size:12px;color:var(--t2)}
.chip[aria-pressed="true"]{background:var(--t1);border-color:var(--t1);color:var(--sf)}
.lista{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 8px;border-radius:10px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.item:hover{background:var(--s2)}
.item .cod{font-weight:600}
.item .sub{font-size:11px;color:var(--t3)}
.item .pct{font-weight:600}
.mini{height:6px;border-radius:3px;background:var(--s2);overflow:hidden;margin-top:4px}
.mini i{display:block;height:100%;border-radius:3px}
.pilula{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:10px;white-space:nowrap}
.pl-cana{background:color-mix(in srgb,var(--plantio) 14%,transparent);color:var(--plantio)}
.pl-torta{background:color-mix(in srgb,#a07840 18%,transparent);color:#a07840}
.pl-pend{background:color-mix(in srgb,var(--colheita) 16%,transparent);color:var(--colheita)}
.pl-pub{background:color-mix(in srgb,var(--plantio) 14%,transparent);color:var(--plantio)}
.pl-rec{background:color-mix(in srgb,var(--erro) 13%,transparent);color:var(--erro)}
.pl-fme{background:var(--s2);color:var(--t3)}
.pl-ins{background:var(--s2);color:var(--t3)}
.barras{display:flex;align-items:flex-end;gap:8px;height:92px;padding-top:14px}
.barras .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.barras .b i{width:100%;border-radius:5px 5px 2px 2px;display:block;position:relative}
.barras .b span{font-size:10px;color:var(--t3)}
.barras .b em{font-style:normal;font-size:10px;font-weight:600;color:var(--t2)}
.tab{width:100%;border-collapse:collapse;font-size:12px}
.tab th{text-align:left;font-weight:500;color:var(--t3);font-size:11px;padding:4px 6px;border-bottom:1px solid var(--bd)}
.tab td{padding:6px;border-bottom:1px solid var(--bd)}
.tab tr.cl{cursor:pointer}
.tab tr.cl:hover td{background:var(--s2)}
.tab .r{text-align:right}
.rolar{overflow-x:auto}
.botao{border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--t1);color:var(--sf);position:relative;overflow:hidden;min-height:40px}
.botao.verde{background:var(--plantio);color:#fff}
.botao.claro{background:var(--s2);color:var(--t1)}
.botao.perigo{background:color-mix(in srgb,var(--erro) 12%,transparent);color:var(--erro)}
.botao:disabled{opacity:.5;cursor:default}
.botao.ok{background:var(--plantio);color:#fff}
.botao.falhou{background:var(--erro);color:#fff;animation:treme .4s}
.botoes{display:flex;gap:8px;flex-wrap:wrap}
.botoes .botao{flex:1}
.aviso{display:flex;gap:8px;align-items:flex-start;font-size:12px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--colheita) 10%,transparent);color:var(--t2)}
.aviso .ico{font-size:17px;color:var(--colheita)}
.aviso.info{background:var(--s2)}
.aviso.info .ico{color:var(--t3)}
.aviso.erro{background:color-mix(in srgb,var(--erro) 9%,transparent)}
.aviso.erro .ico{color:var(--erro)}
.solta{border:2px dashed var(--bd2);border-radius:var(--r-lg);padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--t3)}
.solta .ico{font-size:34px;color:var(--plantio)}
.solta b{color:var(--t1);font-size:14px}
.fila{display:flex;flex-direction:column;gap:8px}
.fi{border:1px solid var(--bd);border-radius:var(--r-md);padding:10px 12px;animation:entra2 .35s var(--sai)}
.fi .l1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.fi .n{font-weight:600}
.fi .s{font-size:11px;color:var(--t3);margin-top:2px}
.prog{height:8px;border-radius:4px;background:var(--s2);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--plantio);border-radius:4px;transition:width .25s linear;background-image:linear-gradient(45deg,rgb(255 255 255/.25) 25%,transparent 25%,transparent 50%,rgb(255 255 255/.25) 50%,rgb(255 255 255/.25) 75%,transparent 75%);background-size:22.6px 22.6px;animation:listra .8s linear infinite}
.trator{border:1px solid var(--bd);border-radius:var(--r-md);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.trator .l1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.trator .serie{font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums}
.trator select{border:1px solid var(--bd2);background:var(--sf);border-radius:8px;padding:4px 6px}
.hist{display:flex;align-items:flex-end;gap:2px;height:70px;position:relative}
.hist i{flex:1;border-radius:2px 2px 0 0;display:block}
.hist-eixo{display:flex;justify-content:space-between;font-size:10px;color:var(--t3);margin-top:4px}
.antesdepois{display:flex;gap:2px;background:var(--s2);padding:3px;border-radius:10px}
.antesdepois button{flex:1;border:0;background:none;border-radius:8px;padding:6px;cursor:pointer;font-weight:500;color:var(--t2)}
.antesdepois button[aria-pressed="true"]{background:var(--sf);color:var(--t1);box-shadow:var(--sh-sm)}
textarea{width:100%;border:1px solid var(--bd2);border-radius:10px;padding:8px 10px;background:var(--sf);resize:vertical;min-height:64px}
.entra{animation:entra2 .35s var(--sai) both}

/* concluído (Mo.concluido) */
.concl{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--sf) 70%,transparent);animation:some 1.9s var(--sai) forwards;pointer-events:none;z-index:5}
.concl .selo{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px}
.concl svg{width:76px;height:76px}
.concl circle.c{fill:var(--plantio)}
.concl path{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:traco .5s .25s var(--sai) forwards}
.concl .onda{position:absolute;top:0;left:50%;width:76px;height:76px;margin-left:-38px;border-radius:50%;border:3px solid var(--plantio);animation:onda .9s .2s ease-out forwards;opacity:0}
.concl b{font-size:15px;font-weight:600;background:var(--sf);padding:4px 12px;border-radius:12px;box-shadow:var(--sh-sm)}

/* notas da maquete */
.notas{position:fixed;inset:auto max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) auto;width:min(420px,calc(100% - 32px));max-height:min(70vh,560px);overflow:auto;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r-lg);box-shadow:var(--sh-md);padding:16px 18px;z-index:20;font-size:12.5px;line-height:1.55;color:var(--t2)}
.notas h4{margin:0 0 6px;font-size:13px;color:var(--t1)}
.notas ul{margin:0 0 12px;padding-left:18px}
.notas code{font-size:11.5px;background:var(--s2);padding:1px 5px;border-radius:5px}
.notas .fechar{float:right;border:0;background:none;cursor:pointer;color:var(--t3)}

@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .palco{grid-template-columns:1fr}
  .mapa{height:58vh}
  .col{border-left:0;border-top:1px solid var(--bd)}
  .abas{margin-left:0;order:3;width:100%;overflow-x:auto}
  .camadas{top:auto;bottom:62px;left:12px;right:auto}
  .exemplo{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>

<div class="app">
  <header class="topo">
    <button class="voltar" type="button" title="Voltar ao Hub"><span class="ico">arrow_back</span>Hub</button>
    <div class="marca"><span class="sel"><span class="ico">straighten</span></span>Paralelismo</div>
    <nav class="abas" role="tablist" id="abas"></nav>
    <div class="espaco"></div>
    <label class="nivel" for="nivel">Ver como
      <select id="nivel">
        <option value="leitura">Leitura</option>
        <option value="solicitante">Solicitante</option>
        <option value="editor" selected>Editor</option>
        <option value="admin">Admin</option>
      </select>
    </label>
    <button class="btn-notas" type="button" id="btn-notas"><span class="ico" style="font-size:18px">sticky_note_2</span>Notas</button>
  </header>
  <main class="palco">
    <section class="mapa" id="mapa" aria-label="Mapa dos talhões">
      <canvas id="cv"></canvas>
      <div class="trilha" id="trilha"></div>
      <div class="exemplo">Maquete · dados de exemplo</div>
      <div class="camadas" id="camadas"></div>
      <div class="legenda" id="legenda"></div>
      <div class="zoom">
        <button type="button" id="z-mais" title="Aproximar"><span class="ico">add</span></button>
        <button type="button" id="z-menos" title="Afastar"><span class="ico">remove</span></button>
        <button type="button" id="z-tudo" title="Ver a usina"><span class="ico">zoom_out_map</span></button>
      </div>
      <div class="dica" id="dica"></div>
    </section>
    <aside class="col" id="col"></aside>
  </main>
</div>
<div class="notas" id="notas" hidden></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const REDUZ = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmt = (n, c = 1) => n.toLocaleString('pt-BR', { minimumFractionDigits: c, maximumFractionDigits: c });
const pct = (a, b) => b ? 100 * a / b : 0;
const MESES = { '2026-08': 'ago', '2026-09': 'set', '2026-10': 'out' };

// ── dados de exemplo (gerados, determinísticos) ─────────────────────────────
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(r) { let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
function erfinv(x) { const a = .147, l = Math.log(1 - x * x), b = 2 / (Math.PI * a) + l / 2; return Math.sign(x) * Math.sqrt(Math.sqrt(b * b - l / a) - b); }

const FAZ = [

function ligarCol(col) {
  col.querySelectorAll('[data-op]').forEach(b => b.onclick = () => { S.op = b.dataset.op; renderCol(); desenhar(); trilha(); });
  col.querySelectorAll('[data-faz]').forEach(b => b.onclick = () => { S.faz = +b.dataset.faz; S.tal = null; voar(PORCOD[S.faz].bbox, 60); renderCol(); trilha(); });
  col.querySelectorAll('[data-tal]').forEach(b => b.onclick = () => { S.tal = +b.dataset.tal; voar(bboxPoly(PORCOD[S.faz].talhoes[S.tal].poly), 90); renderCol(); trilha(); });

  col.querySelectorAll('[data-rod]').forEach(b => b.onclick = () => { S.rodadaSel = +b.dataset.rod; S.antes = false; S.recusando = false; S.camada = 'mudanca'; voar(bboxDe(S.rodadas.find(r => r.id === S.rodadaSel).faz), 70); tudo(); });
  col.querySelectorAll('[data-rod2]').forEach(b => b.onclick = () => { S.rodadaSel = S.rodadaSel === +b.dataset.rod2 ? null : +b.dataset.rod2; if (S.rodadaSel) voar(bboxDe(S.rodadas.find(r => r.id === S.rodadaSel).faz), 70); tudo(); });
  col.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => { S.subRodadas = b.dataset.sub; renderCol(); });
  col.querySelectorAll('[data-ad]').forEach(b => b.onclick = () => { S.antes = b.dataset.ad === '0'; tudo(); });
  const on = (id, fn) => { const el = col.querySelector('#' + id); if (el) el.onclick = fn; };
  on('bt-pendrive', escolherPendrive);
  on('bt-fila', adicionarFila);
  on('bt-descartar', () => { S.fila = []; S.filaFase = 'vazia'; tudo(); });
  on('bt-enviar', e => enviar(e.currentTarget));
  on('bt-novo', () => { S.fila = []; S.filaFase = 'vazia'; tudo(); });
  on('bt-ir-pend', () => irAba('pendentes'));
  on('bt-volta-pend', () => { S.rodadaSel = null; S.camada = 'aderencia'; voarUsina(); tudo(); });
  on('bt-publicar', e => publicar(e.currentTarget));
  on('bt-recusar', () => { S.recusando = true; renderCol(); col.querySelector('#motivo')?.focus(); });
  on('bt-rec-cancela', () => { S.recusando = false; renderCol(); });
  on('bt-rec-ok', e => recusar(e.currentTarget));
  on('bt-relatorio', () => { notas(true); });
}

// ── fluxo ───────────────────────────────────────────────────────────────────
async function escolherPendrive() {
  S.fila = [{ nome: 'pen-drives 26/10/2026', sub: 'lendo a pasta…', estado: 'copiando', faz: [10966, 10233, 10010] }];
  S.filaFase = 'copiando'; tudo();
  const total = 287.4, passos = REDUZ ? 1 : 40;
  for (let i = 1; i <= passos; i++) {
    await espera(45);
    const mb = total * i / passos, el = $('#fila-prog'), tx = $('#fila-txt');
    if (el) el.style.width = (100 * i / passos) + '%';
    if (tx) tx.textContent = `SHA-256 e cópia no navegador · ${fmt(mb)} MB de ${fmt(total)} MB · 203 arquivos`;
  }
  S.fila[0].estado = 'conferencia'; S.fila[0].sub = 'Pode retirar o pen-drive · cópia guardada no navegador';
  S.filaFase = 'conferencia'; tudo();
}
function adicionarFila() {
  S.fila[0].estado = 'processando'; S.fila[0].sub = 'preparando a análise…'; S.filaFase = 'processando';
  S.camada = 'aderencia'; tudo(); iniciarAnim([10966, 10233, 10010]);
}
async function enviar(btn) {
  const fim = moOcupado(btn, 'Enviando…');
  const box = $('#envio-prog'); box.innerHTML = '<div class="fi"><div class="s" id="ep-t"></div><div class="prog"><i id="ep-b" style="width:0"></i></div></div>';
  const total = 151.8, partes = [[0, 90], [90, 151.8]];
  for (let i = 0; i <= 30; i++) { await espera(50); const mb = total * i / 30, pa = mb <= 90 ? 1 : 2; $('#ep-b').style.width = (100 * i / 30) + '%'; $('#ep-t').textContent = `Parte ${pa} de 2 · ${fmt(mb)} MB de ${fmt(total)} MB (zip dos brutos)`; }
  $('#ep-t').textContent = 'Gravando a rodada e as linhas…'; await espera(700);
  await fim(true);
  S.rodadas.unshift({ id: 12, desc: 'pen-drives 26/10/2026', por: 'Leonardo', em: '29/10 10:31', status: 'pendente', faz: [10966, 10233, 10010], tratores: 3, brutos: '2 partes · 152 MB' });
  S.fila[0].estado = 'enviada'; S.fila[0].sub = 'rodada r12 · aguardando validação'; S.filaFase = 'enviada';
  await moConcluido('Enviado para validação');
  tudo(); contador(true);
}
async function publicar(btn) {
  const fim = moOcupado(btn, 'Publicando…'); await espera(900); await fim(true);
  const r = S.rodadas.find(x => x.id === S.rodadaSel);
  r.status = 'publicada'; r.val = 'Leonardo';
  r.faz.forEach(c => { const f = PORCOD[c]; f.ds.vig = f.ds.nova; f.vig = f.nova; delete f.ds.nova; });
  await moConcluido('Publicada no painel');
  S.rodadaSel = null; S.camada = 'aderencia'; tudo(); contador(true);
}
async function recusar(btn) {
  const m = $('#motivo').value.trim();
  if (!m) { $('#motivo').style.borderColor = 'var(--erro)'; $('#motivo').placeholder = 'Escreva o motivo para recusar'; $('#motivo').focus(); return; }
  const fim = moOcupado(btn, 'Recusando…'); await espera(700); await fim(true);
  const r = S.rodadas.find(x => x.id === S.rodadaSel); r.status = 'recusada'; r.val = 'Leonardo'; r.motivo = m;
  S.rodadaSel = null; S.recusando = false; S.camada = 'aderencia'; tudo(); contador(true);
}

// ── abas, notas, início ─────────────────────────────────────────────────────
function contador(pop) {
  const p = PERM[S.nivel], n = S.rodadas.filter(r => r.status === 'pendente' && (p.valida || r.por === 'Leonardo')).length;
  const el = document.querySelector('[data-aba="pendentes"] .cont'); if (!el) return;
  el.textContent = n; el.hidden = !n; if (pop && !REDUZ) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
}
function abas() {
  const p = PERM[S.nivel];
  if (!p.abas.includes(S.aba)) S.aba = 'painel';
  $('#abas').innerHTML = p.abas.map(a => `<button type="button" role="tab" class="aba" data-aba="${a}" aria-selected="${S.aba === a}"><span class="ico" style="font-size:18px">${ABAS[a][1]}</span>${ABAS[a][0]}${a === 'pendentes' ? '<span class="cont"></span>' : ''}</button>`).join('');
  $('#abas').querySelectorAll('.aba').forEach(b => b.onclick = () => irAba(b.dataset.aba));
  contador();
}
function irAba(a) {
  S.aba = a; S.rodadaSel = null; S.recusando = false;
  if (a !== 'processar') tirarFaixa(); else if (S.anim && S.anim.fase >= 0) faixaFase();
  if (a === 'painel' && S.faz) voar(PORCOD[S.faz].bbox, 60); else if (a === 'processar' && S.fila[0]) voar(bboxDe(S.fila[0].faz), 70); else voarUsina();
  if (a === 'painel' || a === 'rodadas') S.camada = 'aderencia';
  tudo();
}
function tudo() { abas(); camadas(); trilha(); renderCol(); desenhar(); }

function notas(abrir) {
  const el = $('#notas');
  if (abrir === true) el.hidden = false;
  el.innerHTML = `<button type="button" class="fechar" id="fx-notas"><span class="ico">close</span></button><h4>Notas da maquete · ${ABAS[S.aba][0]}</h4><ul>${NOTAS[S.aba].map(n => `<li>${n}</li>`).join('')}</ul>
  <h4>Fora da maquete</h4><ul><li>Mapa de fundo (no Hub: MapLibre com <code>talhao_geom</code>); aqui os talhões e as amostras são gerados.</li><li>Números de exemplo, coerentes entre si (a aderência sai das amostras desenhadas).</li></ul>`;
  $('#fx-notas').onclick = () => { el.hidden = true; };
}
$('#btn-notas').onclick = () => { const el = $('#notas'); el.hidden = !el.hidden; if (!el.hidden) notas(); };
$('#nivel').onchange = e => { S.nivel = e.target.value; S.rodadaSel = null; tudo(); };

function redimensionar() {
  const r = cv.getBoundingClientRect(); DPR = window.devicePixelRatio || 1;
  const primeira = !CW; CW = r.width; CH = r.height; cv.width = CW * DPR; cv.height = CH * DPR;
  if (primeira) Object.assign(VIEW, vistaPara(bboxDe(FAZ.map(f => f.cod)), 50));
  desenhar();
}
new ResizeObserver(redimensionar).observe($('#mapa'));
lerCores(); tudo();
document.fonts && document.fonts.ready.then(desenhar);
</script>
